services:
  db:
    image: postgres:17
    container_name: langqt-db
    environment:
      POSTGRES_USER: langqt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langqt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langqt -d langqt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: